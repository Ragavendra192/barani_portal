{% extends "base.html" %}

{% block content %}
<div class="manage-permissions-container">
    <div class="page-header">
        <h2>🔐 Manage Application Access</h2>
        <p class="muted-text">Select which applications this user is allowed to launch from their dashboard.</p>
    </div>

    <div class="form-card">
        <form method="POST">
            <div class="table-card">
                <table class="premium-table">
                    <thead>
                        <tr>
                            <th style="width: 80px; text-align: center;">Allow</th>
                            <th>Application Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for app in apps %}
                        <tr>
                            <td style="text-align: center; vertical-align: middle;">
                                <div class="checkbox-wrapper">
                                    <input type="checkbox"
                                           name="apps"
                                           id="app_{{ app[0] }}"
                                           value="{{ app[0] }}"
                                           {% if app[0] in allowed_apps %}checked{% endif %}
                                           class="premium-checkbox">
                                </div>
                            </td>
                            <td class="bold-text">
                                <label for="app_{{ app[0] }}" style="cursor: pointer; display: block; width: 100%;">
                                    {{ app[1] }}
                                </label>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Save Permissions</button>
                <a href="/admin/permissions" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

<!-- ================= CSS STYLING ================= -->
<style>
.manage-permissions-container {
    max-width: 800px;
    margin: 0 auto;
    animation: fadeIn 0.4s ease-out;
}

.page-header {
    margin-bottom: 25px;
}

.page-header h2 {
    font-size: 24px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 6px;
}

.muted-text {
    font-size: 14px;
    color: #64748b;
}

.form-card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid #e2e8f0;
    padding: 24px;
}

/* ----- PREMIUM TABLE CARD ----- */
.table-card {
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    margin-bottom: 24px;
}

.premium-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

.premium-table th {
    background: #f8fafc;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    border-bottom: 1px solid #e2e8f0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.premium-table td {
    padding: 12px 16px;
    font-size: 14px;
    color: #334155;
    border-bottom: 1px solid #f1f5f9;
    vertical-align: middle;
}

.premium-table tbody tr:hover {
    background: #f8fafc;
}

.bold-text {
    font-weight: 600;
    color: #0f172a;
}

/* ----- FORM ACTIONS & BUTTONS ----- */
.form-actions {
    display: flex;
    align-items: center;
    gap: 16px;
}

.btn-save {
    padding: 10px 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-save:hover {
    background: #1d4ed8;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
}

.btn-cancel {
    display: inline-block;
    padding: 10px 20px;
    background: #ffffff;
    color: #475569;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.btn-cancel:hover {
    background: #f8fafc;
    color: #1e293b;
    border-color: #94a3b8;
}

/* Checkbox Style */
.checkbox-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
}

.premium-checkbox {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #2563eb;
}

/* ----- ANIMATIONS ----- */
@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
{% endblock %}
